<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MultiTool DnD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header>
      <div class="header-col left">
        <div class="ios-toggle theme-switch">
          <button class="theme-btn" data-theme="light">☀️</button>
          <button class="theme-btn" data-theme="dark">🌙</button>
        </div>
        <div id="status-name-area" class="status-area left"></div>
      </div>

      <div class="header-col center">
        <button class="dnd-toggle-btn" id="dnd-btn" onclick="toggleDNDMode()">DND MODE</button>
      </div>

      <div class="header-col right">
        <div class="ios-toggle lang-switch">
          <button class="lang-btn" data-lang="uk">UK</button>
          <button class="lang-btn" data-lang="ru">RU</button>
        </div>
        <div id="status-stats-area" class="status-area right"></div>
      </div>
    </header>

    <div id="crit-overlay" class="crit-overlay"></div>

    <div id="menu-screen" class="screen active">
      <div class="menu-grid">
        <div class="menu-item" onclick="openScreen('d4-screen')"><img src="d4.png" class="menu-icon"><span class="menu-label" data-key="d4">D4</span></div>
        <div class="menu-item" onclick="openScreen('d6-screen')"><img src="d6.png" class="menu-icon"><span class="menu-label" data-key="d6">D6</span></div>
        <div class="menu-item" onclick="openScreen('d8-screen')"><img src="d8.png" class="menu-icon"><span class="menu-label" data-key="d8">D8</span></div>
        <div class="menu-item" onclick="openScreen('d10-screen')"><img src="d10.png" class="menu-icon"><span class="menu-label" data-key="d10">D10</span></div>
        <div class="menu-item" onclick="openScreen('d12-screen')"><img src="d12.png" class="menu-icon"><span class="menu-label" data-key="d12">D12</span></div>
        <div class="menu-item" onclick="openScreen('d20-screen')"><img src="d20.png" class="menu-icon"><span class="menu-label" data-key="d20">D20</span></div>
        
        <div class="menu-item" onclick="openScreen('hp-screen')"><div class="menu-icon emoji-icon">❤️</div><span class="menu-label" data-key="hp">HP</span></div>
        <div class="menu-item" onclick="openScreen('score-screen')"><div class="menu-icon emoji-icon">🏆</div><span class="menu-label" data-key="score">Счет</span></div>
        <div class="menu-item" onclick="openScreen('name-screen')"><div class="menu-icon emoji-icon">📜</div><span class="menu-label" data-key="names">Имена</span></div>
        <div class="menu-item" onclick="openScreen('notes-screen')"><div class="menu-icon emoji-icon">✏️</div><span class="menu-label" data-key="notes">Заметки</span></div>

        <div class="menu-item dnd-hide" onclick="openScreen('trump-screen')"><img src="kar.png" class="menu-icon"><span class="menu-label" data-key="trump">Козырь</span></div>
        <div class="menu-item dnd-hide" onclick="openScreen('ball-screen')"><img src="sh.png" class="menu-icon"><span class="menu-label" data-key="ball">Ball</span></div>
        <div class="menu-item dnd-hide" onclick="openScreen('coin-screen')"><img src="mon.png" class="menu-icon"><span class="menu-label" data-key="coin">Coin</span></div>
        <div class="menu-item dnd-hide" onclick="openScreen('slots-screen')"><img src="slot.png" class="menu-icon"><span class="menu-label" data-key="slots">Slots</span></div>
        <div class="menu-item dnd-hide" onclick="openScreen('rand-screen')"><img src="ran.png" class="menu-icon"><span class="menu-label" data-key="rand">Rand</span></div>
        <div class="menu-item dnd-hide" onclick="openScreen('wheel-screen')"><div class="menu-icon emoji-icon">🎡</div><span class="menu-label" data-key="wheel">Колесо</span></div>
        <div class="menu-item dnd-hide" onclick="openScreen('rps-screen')"><div class="menu-icon emoji-icon">✂️</div><span class="menu-label" data-key="rps">К-Н-Б</span></div>
      </div>
    </div>

    <div id="d4-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="canvas-wrapper" id="d4-scene"></div><p class="hint-text" data-key="tap">Нажми</p></div>
    <div id="d6-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="canvas-wrapper" id="d6-scene"></div><p class="hint-text" data-key="tap">Нажми</p></div>
    <div id="d8-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="canvas-wrapper" id="d8-scene"></div><p class="hint-text" data-key="tap">Нажми</p></div>
    <div id="d10-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="canvas-wrapper" id="d10-scene"></div><p class="hint-text" data-key="tap">Нажми</p></div>
    <div id="d12-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="canvas-wrapper" id="d12-scene"></div><p class="hint-text" data-key="tap">Нажми</p></div>
    <div id="d20-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="canvas-wrapper" id="d20-scene"></div><p class="hint-text" data-key="tap">Нажми</p></div>

    <div id="notes-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="notes-container"><textarea id="notes-area" class="glass-textarea" placeholder="..."></textarea></div><button class="glass-btn small" style="margin-top: 10px;" onclick="resetNotes()" data-key="reset">СБРОС</button></div>

    <div id="trump-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="trump-table"><div class="playing-card" onclick="flipTrumpCard(this, 0)"><div class="card-inner"><div class="card-face card-back-side"></div><div class="card-face card-front-side"></div></div></div><div class="playing-card" onclick="flipTrumpCard(this, 1)"><div class="card-inner"><div class="card-face card-back-side"></div><div class="card-face card-front-side"></div></div></div><div class="playing-card" onclick="flipTrumpCard(this, 2)"><div class="card-inner"><div class="card-face card-back-side"></div><div class="card-face card-front-side"></div></div></div><div class="playing-card" onclick="flipTrumpCard(this, 3)"><div class="card-inner"><div class="card-face card-back-side"></div><div class="card-face card-front-side"></div></div></div></div><button class="glass-btn" style="margin-top: 30px" onclick="resetTrumpCards()" data-key="reset">СБРОС</button></div>
    <div id="ball-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="magic-ball-outer" onclick="askBall()"><div class="magic-ball-inner"><span id="ball-text" class="ball-text">8</span></div></div></div>
    <div id="coin-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="coin-wrapper"><div class="coin" onclick="flipCoin()"><div class="coin-face side-a" data-key="heads">ОРЕЛ</div><div class="coin-face coin-back side-b" data-key="tails">РЕШКА</div></div></div><p class="hint-text" data-key="tap">Нажми</p></div>
    <div id="slots-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="slot-machine"><div class="reel-window"><div class="reel" id="reel-1">🍒</div></div><div class="reel-window"><div class="reel" id="reel-2">🍒</div></div><div class="reel-window"><div class="reel" id="reel-3">🍒</div></div></div><div id="slot-msg" style="text-align:center; height:30px; font-weight:bold; margin-top:10px;"></div><button class="glass-btn" style="margin-top:20px; width:100%" onclick="spinSlots()" data-key="spin_btn">КРУТИТЬ</button></div>
    <div id="rand-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="input-group"><label data-key="rand_limit_label">Max:</label><input type="number" id="rand-max" class="glass-input" value="100"><div id="rand-display" class="big-number">0</div><button class="glass-btn" onclick="generateRandom()" data-key="generate">СТАРТ</button></div></div>
    <div id="hp-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="mode-switch"><button class="mode-btn active" onclick="setPlayers('hp', 1)">1P</button><button class="mode-btn" onclick="setPlayers('hp', 2)">2P</button></div><div id="hp-container" class="counter-container"></div><button class="glass-btn reset-tool-btn" onclick="resetCounter('hp')" data-key="reset">СБРОС</button></div>
    <div id="score-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="mode-switch"><button class="mode-btn active" onclick="setPlayers('score', 1)">1P</button><button class="mode-btn" onclick="setPlayers('score', 2)">2P</button></div><div id="score-container" class="counter-container"></div><button class="glass-btn reset-tool-btn" onclick="resetCounter('score')" data-key="reset">СБРОС</button></div>
    <div id="name-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="name-display" id="generated-name">...</div><div class="name-controls"><button class="glass-btn" onclick="generateName()" data-key="generate">ГЕНЕРАЦИЯ</button><button class="glass-btn small" onclick="resetName()" data-key="reset">СБРОС</button></div></div>
    <div id="wheel-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="wheel-wrapper"><canvas id="wheel-canvas" width="300" height="300"></canvas><div class="wheel-pointer">▼</div></div><button class="glass-btn" onclick="spinWheel()" data-key="spin_btn">КРУТИТЬ</button><div class="wheel-inputs"><input type="text" id="wheel-add-input" class="glass-input" placeholder="+"><button class="icon-btn" onclick="addWheelSegment()">+</button><button class="icon-btn" onclick="resetWheel()">↻</button></div></div>
    <div id="rps-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="rps-arena"><div id="rps-top" class="rps-side inverted"><span class="rps-icon">🤖</span></div><div id="rps-bottom" class="rps-side"><span class="rps-icon">👤</span></div><button class="glass-btn round-start" onclick="playRPS()">GO</button></div></div>

    <footer><span data-key="dev">Developer:</span> <a href="https://t.me/desoope" target="_blank">DesOope</a></footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
