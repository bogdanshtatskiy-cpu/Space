<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MultiTool 3D</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    :root {
      --text-primary: #ffffff;
      --font-stack: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: var(--font-stack);
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Навигация */
    .app-header {
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: absolute;
      top: 0;
      width: 100%;
      box-sizing: border-box;
      z-index: 10;
    }
    
    .back-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    /* Контейнер для 3D */
    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Результат поверх кубика */
    .result-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 80px;
      font-weight: 900;
      color: white;
      text-shadow: 0 0 30px rgba(10, 132, 255, 0.8);
      z-index: 5;
      pointer-events: none; /* Чтобы клики проходили сквозь цифру */
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .result-overlay.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }
    
    .result-overlay.hide {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.5);
    }

    .hint {
      position: absolute;
      bottom: 50px;
      width: 100%;
      text-align: center;
      opacity: 0.6;
      z-index: 5;
      pointer-events: none;
      font-size: 14px;
    }

  </style>
</head>
<body>

  <div class="app-header">
    <button class="back-btn" onclick="location.reload()">MultiTool</button>
    <span>D20 3D</span>
  </div>

  <div id="canvas-container"></div>
  
  <div id="result-num" class="result-overlay hide">20</div>
  
  <div class="hint">Коснитесь экрана, чтобы бросить</div>

  <script>
    // --- НАСТРОЙКИ THREE.JS ---
    let scene, camera, renderer, d20mesh, wireframe;
    let isRolling = false;
    let spinSpeed = { x: 0.005, y: 0.005 }; // Скорость медленного вращения

    function init() {
      const container = document.getElementById('canvas-container');

      // 1. Сцена
      scene = new THREE.Scene();
      // Легкий туман для глубины
      scene.fog = new THREE.FogExp2(0x1a1a2e, 0.02);

      // 2. Камера
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.z = 6;

      // 3. Рендерер (Вывод графики)
      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // 4. Свет (чтобы было красиво)
      const ambientLight = new THREE.AmbientLight(0x404040, 2); // Мягкий свет
      scene.add(ambientLight);

      const spotLight = new THREE.SpotLight(0x0a84ff, 2); // Синий прожектор сверху
      spotLight.position.set(5, 10, 5);
      spotLight.angle = Math.PI / 4;
      spotLight.penumbra = 0.5;
      scene.add(spotLight);

      const pointLight = new THREE.PointLight(0xff00ff, 1); // Розовая подсветка снизу
      pointLight.position.set(-5, -5, 5);
      scene.add(pointLight);

      // 5. Создаем D20 (Икосаэдр)
      const geometry = new THREE.IcosahedronGeometry(1.8, 0); // Радиус 1.8, детализация 0

      // Материал "Кристалл"
      const material = new THREE.MeshPhysicalMaterial({
        color: 0x222222,
        metalness: 0.1,
        roughness: 0.1,
        transmission: 0.6, // Прозрачность стекла
        opacity: 1,
        transparent: true,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1,
      });

      d20mesh = new THREE.Mesh(geometry, material);
      scene.add(d20mesh);

      // Добавляем красивый каркас (Wireframe), чтобы видеть грани
      const wireGeo = new THREE.WireframeGeometry(geometry);
      const wireMat = new THREE.LineBasicMaterial({ color: 0x0a84ff, linewidth: 2 });
      wireframe = new THREE.LineSegments(wireGeo, wireMat);
      d20mesh.add(wireframe);

      // Обработчики событий
      window.addEventListener('resize', onWindowResize, false);
      document.body.addEventListener('click', rollDice, false);

      // Запуск анимации
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // --- ЛОГИКА АНИМАЦИИ ---
    function animate() {
      requestAnimationFrame(animate);

      // Постоянное вращение
      d20mesh.rotation.x += spinSpeed.x;
      d20mesh.rotation.y += spinSpeed.y;

      renderer.render(scene, camera);
    }

    // --- ЛОГИКА БРОСКА ---
    function rollDice() {
      if (isRolling) return;
      isRolling = true;

      const resultEl = document.getElementById('result-num');
      
      // 1. Скрываем прошлый результат
      resultEl.classList.remove('show');
      resultEl.classList.add('hide');

      // 2. Ускоряем вращение (эффект броска)
      // Используем простую интерполяцию для разгона и торможения
      let duration = 0;
      const maxDuration = 100; // кадров анимации (~1.5 сек)
      
      // Случайное направление вращения
      const targetSpeedX = (Math.random() - 0.5) * 0.8;
      const targetSpeedY = (Math.random() - 0.5) * 0.8;

      const rollInterval = setInterval(() => {
        duration++;
        
        // В первой половине времени - быстро крутим
        if (duration < 50) {
           spinSpeed.x = targetSpeedX;
           spinSpeed.y = targetSpeedY;
        } 
        // Во второй половине - замедляем
        else {
           spinSpeed.x *= 0.92; // Торможение
           spinSpeed.y *= 0.92;
        }

        // Финиш
        if (duration >= maxDuration) {
          clearInterval(rollInterval);
          
          // Возвращаем к медленному парению
          spinSpeed.x = 0.005; 
          spinSpeed.y = 0.005;
          
          showResult();
          isRolling = false;
        }
      }, 16); // ~60fps
    }

    function showResult() {
      const resultEl = document.getElementById('result-num');
      const num = Math.floor(Math.random() * 20) + 1;
      
      resultEl.innerText = num;
      
      // Цвет в зависимости от удачи
      if (num === 20) resultEl.style.color = "#00ff00"; // Зеленый
      else if (num === 1) resultEl.style.color = "#ff3333"; // Красный
      else resultEl.style.color = "white";

      resultEl.classList.remove('hide');
      resultEl.classList.add('show');
    }

    // Запуск
    init();

  </script>
</body>
</html>
