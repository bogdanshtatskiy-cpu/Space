<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Frosted 3D D20</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      /* Немного осветлил фон, чтобы стекло лучше смотрелось */
      background: radial-gradient(circle at center, #2a2a4e, #0f0c29);
      font-family: sans-serif;
      touch-action: none;
    }

    #container {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      border-radius: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px); /* Матовое стекло на кнопке для соответствия */
      z-index: 10;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
    }

    .hint {
      position: absolute;
      bottom: 10%;
      width: 100%;
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      pointer-events: none;
      font-size: 16px;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <a href="#" class="back-btn" onclick="location.reload()">MultiTool</a>
  <div class="hint">Коснитесь экрана, чтобы бросить</div>
  
  <div id="container"></div>

  <script>
    // --- НАСТРОЙКИ ---
    const DICE_COLOR = 0x3a94ff; // Немного ярче синий для стекла
    const TEXT_COLOR = 'white';
    const SIZE = 9;              // УМЕНЬШИЛ РАЗМЕР (было 12)

    let scene, camera, renderer;
    let diceGroup;
    let isRolling = false;
    const faceNormals = [];

    init();
    animate();

    function init() {
      const container = document.getElementById('container');

      scene = new THREE.Scene();
      
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
      camera.position.z = 50;

      renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      // Включаем физически корректное освещение для стекла
      renderer.physicallyCorrectLights = true;
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      container.appendChild(renderer.domElement);

      // --- ОСВЕЩЕНИЕ ДЛЯ СТЕКЛА ---
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);
      
      // Основной свет сверху-сбоку
      const mainLight = new THREE.DirectionalLight(0xffffff, 2);
      mainLight.position.set(10, 20, 15);
      scene.add(mainLight);
      
      // Контровой свет сзади (чтобы просвечивало)
      const backLight = new THREE.SpotLight(0x00ffff, 3);
      backLight.position.set(0, 10, -20);
      backLight.lookAt(0,0,0);
      scene.add(backLight);
      
      // Нижний заполняющий
      const bottomLight = new THREE.PointLight(0x0a84ff, 1);
      bottomLight.position.set(0, -20, 10);
      scene.add(bottomLight);

      createD20();

      window.addEventListener('resize', onWindowResize, false);
      container.addEventListener('click', rollDice);
      container.addEventListener('touchstart', rollDice, {passive: false});
    }

    function createD20() {
      diceGroup = new THREE.Group();
      scene.add(diceGroup);

      const geometry = new THREE.IcosahedronGeometry(SIZE, 0);
      
      // --- НОВЫЙ МАТЕРИАЛ: МАТОВОЕ СТЕКЛО (Frosted Glass) ---
      const material = new THREE.MeshPhysicalMaterial({
        color: DICE_COLOR,
        metalness: 0.0,       // Стекло не металл
        roughness: 0.35,      // Шероховатость (0 - глянец, 1 - шершавый). 0.35 - матовое.
        transmission: 0.98,   // Пропускание света (почти полное)
        ior: 1.5,             // Коэффициент преломления (как у стекла)
        thickness: 2.0,       // Толщина для реалистичного поглощения света
        transparent: true,    // Включаем прозрачность
        opacity: 0.9,         // Общая непрозрачность
        flatShading: true,    // Оставляем грани четкими, как у кристалла
        side: THREE.DoubleSide // Рендерим обе стороны, чтобы видеть сквозь него
      });

      const mesh = new THREE.Mesh(geometry, material);
      diceGroup.add(mesh);

      // Wireframe делаем еле заметным
      const wireframe = new THREE.LineSegments(
        new THREE.WireframeGeometry(geometry),
        new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.15 })
      );
      diceGroup.add(wireframe);

      // --- ЦИФРЫ ---
      const posAttribute = geometry.attributes.position;
      let faceIndex = 0;
      for (let i = 0; i < posAttribute.count; i += 3) {
        faceIndex++;
        const v1 = new THREE.Vector3().fromBufferAttribute(posAttribute, i);
        const v2 = new THREE.Vector3().fromBufferAttribute(posAttribute, i + 1);
        const v3 = new THREE.Vector3().fromBufferAttribute(posAttribute, i + 2);
        const center = new THREE.Vector3().addVectors(v1, v2).add(v3).divideScalar(3);
        const normal = center.clone().normalize();
        faceNormals.push({ normal: normal.clone(), value: faceIndex });

        const textMesh = createTextLabel(faceIndex.toString());
        // Чуть ближе к поверхности, чем раньше
        textMesh.position.copy(center.multiplyScalar(1.01)); 
        textMesh.lookAt(center.multiplyScalar(2)); 
        diceGroup.add(textMesh);
      }
    }

    function createTextLabel(text) {
      const canvas = document.createElement('canvas');
      const size = 128;
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(0,0,0,0)';
      ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = TEXT_COLOR;
      ctx.font = 'bold 70px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      let yOffset = 0;
      if (text === '6' || text === '9') yOffset = 5;
      ctx.fillText(text, size / 2, size / 2 + yOffset);
      if (text === '6' || text === '9') {
         ctx.font = 'bold 20px Arial';
         ctx.fillText('.', size / 2, size - 20);
      }
      const texture = new THREE.CanvasTexture(canvas);
      
      const planeGeo = new THREE.PlaneGeometry(SIZE/2.2, SIZE/2.2); 
      const planeMat = new THREE.MeshBasicMaterial({ 
        map: texture, 
        transparent: true, 
        opacity: 0.95,
        // Важно: FrontSide, чтобы цифры с обратной стороны не просвечивали зеркально через стекло
        side: THREE.FrontSide 
      });
      
      const mesh = new THREE.Mesh(planeGeo, planeMat);
      return mesh;
    }

    // --- ЛОГИКА БРОСКА (та же самая) ---
    function rollDice(e) {
      if (e) e.preventDefault();
      if (isRolling) return;
      isRolling = true;

      const resultIndex = Math.floor(Math.random() * 20);
      const targetFace = faceNormals[resultIndex];
      
      const targetVector = new THREE.Vector3(0, 0, 1);
      const targetQuaternion = new THREE.Quaternion();
      targetQuaternion.setFromUnitVectors(targetFace.normal, targetVector);

      let progress = 0;
      const duration = 2000;
      const startTime = performance.now();
      
      function animateRoll(time) {
        const elapsed = time - startTime;
        progress = elapsed / duration;
        if (progress < 1) {
          if (progress < 0.7) {
            diceGroup.rotation.x += 0.2;
            diceGroup.rotation.y += 0.2;
          } else {
            diceGroup.quaternion.slerp(targetQuaternion, 0.15);
          }
          requestAnimationFrame(animateRoll);
        } else {
          diceGroup.quaternion.copy(targetQuaternion);
          isRolling = false;
        }
      }
      requestAnimationFrame(animateRoll);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      if (!isRolling) {
        diceGroup.rotation.x += 0.002;
        diceGroup.rotation.y += 0.003;
      }
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
