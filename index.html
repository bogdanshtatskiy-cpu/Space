<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MultiTool DnD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header>
      <div class="controls">
        <button class="icon-btn" id="theme-toggle"><span id="theme-icon">🌙</span></button>
      </div>
      <div class="ios-toggle">
        <button class="lang-btn" data-lang="uk">UK</button>
        <button class="lang-btn" data-lang="ru">RU</button>
      </div>
    </header>

    <div id="menu-screen" class="screen active">
      <div class="menu-grid">
        <div class="menu-item" onclick="openScreen('d4-screen')">
            <img src="d4.png" class="menu-icon" alt="D4">
            <span class="menu-label" data-key="d4">D4</span>
        </div>
        <div class="menu-item" onclick="openScreen('d6-screen')">
            <img src="d6.png" class="menu-icon" alt="D6">
            <span class="menu-label" data-key="d6">D6</span>
        </div>
        <div class="menu-item" onclick="openScreen('d8-screen')">
            <img src="d8.png" class="menu-icon" alt="D8">
            <span class="menu-label" data-key="d8">D8</span>
        </div>
        <div class="menu-item" onclick="openScreen('d10-screen')">
            <img src="d10.png" class="menu-icon" alt="D10">
            <span class="menu-label" data-key="d10">D10</span>
        </div>
        <div class="menu-item" onclick="openScreen('d12-screen')">
            <img src="d12.png" class="menu-icon" alt="D12">
            <span class="menu-label" data-key="d12">D12</span>
        </div>
        <div class="menu-item" onclick="openScreen('d20-screen')">
            <img src="d20.png" class="menu-icon" alt="D20">
            <span class="menu-label" data-key="d20">D20</span>
        </div>
        
        <div class="menu-item" onclick="openScreen('trump-screen')">
            <img src="kar.png" class="menu-icon" alt="Trump">
            <span class="menu-label" data-key="trump">Козырь</span>
        </div>
        <div class="menu-item" onclick="openScreen('ball-screen')">
            <img src="sh.png" class="menu-icon" alt="Ball">
            <span class="menu-label" data-key="ball">Ball</span>
        </div>
        <div class="menu-item" onclick="openScreen('coin-screen')">
            <img src="mon.png" class="menu-icon" alt="Coin">
            <span class="menu-label" data-key="coin">Coin</span>
        </div>
        <div class="menu-item" onclick="openScreen('slots-screen')">
            <img src="slot.png" class="menu-icon" alt="Slots">
            <span class="menu-label" data-key="slots">Slots</span>
        </div>
        <div class="menu-item" onclick="openScreen('rand-screen')">
            <img src="ran.png" class="menu-icon" alt="Random">
            <span class="menu-label" data-key="rand">Rand</span>
        </div>
      </div>
    </div>

    <div id="d4-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="canvas-wrapper" id="d4-scene"></div><p class="hint-text" data-key="tap">Нажми</p></div>
    <div id="d6-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="canvas-wrapper" id="d6-scene"></div><p class="hint-text" data-key="tap">Нажми</p></div>
    <div id="d8-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="canvas-wrapper" id="d8-scene"></div><p class="hint-text" data-key="tap">Нажми</p></div>
    <div id="d10-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="canvas-wrapper" id="d10-scene"></div><p class="hint-text" data-key="tap">Нажми</p></div>
    <div id="d12-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="canvas-wrapper" id="d12-scene"></div><p class="hint-text" data-key="tap">Нажми</p></div>
    <div id="d20-screen" class="screen"><button class="back-btn" onclick="goBack()" data-key="back">Назад</button><div class="canvas-wrapper" id="d20-scene"></div><p class="hint-text" data-key="tap">Нажми</p></div>

    <div id="trump-screen" class="screen">
        <button class="back-btn" onclick="goBack()" data-key="back">Назад</button>
        <div class="trump-table">
            <div class="playing-card" onclick="flipTrumpCard(this, 0)"><div class="card-inner"><div class="card-face card-back-side"></div><div class="card-face card-front-side"></div></div></div>
            <div class="playing-card" onclick="flipTrumpCard(this, 1)"><div class="card-inner"><div class="card-face card-back-side"></div><div class="card-face card-front-side"></div></div></div>
            <div class="playing-card" onclick="flipTrumpCard(this, 2)"><div class="card-inner"><div class="card-face card-back-side"></div><div class="card-face card-front-side"></div></div></div>
            <div class="playing-card" onclick="flipTrumpCard(this, 3)"><div class="card-inner"><div class="card-face card-back-side"></div><div class="card-face card-front-side"></div></div></div>
        </div>
        <button class="glass-btn" style="margin-top: 30px" onclick="resetTrumpCards()" data-key="reset">СБРОС</button>
    </div>

    <div id="ball-screen" class="screen">
      <button class="back-btn" onclick="goBack()" data-key="back">Назад</button>
      <div class="magic-ball-outer" onclick="askBall()">
        <div class="magic-ball-inner"><span id="ball-text" class="ball-text">8</span></div>
      </div>
    </div>

    <div id="coin-screen" class="screen">
      <button class="back-btn" onclick="goBack()" data-key="back">Назад</button>
      <div class="coin-wrapper">
        <div class="coin" onclick="flipCoin()">
          <div class="coin-face side-a" data-key="heads">ОРЕЛ</div>
          <div class="coin-face coin-back side-b" data-key="tails">РЕШКА</div>
        </div>
      </div>
      <p class="hint-text" data-key="tap">Нажми</p>
    </div>

    <div id="slots-screen" class="screen">
      <button class="back-btn" onclick="goBack()" data-key="back">Назад</button>
      <div class="slot-machine">
        <div class="reel-window"><div class="reel" id="reel-1">🍒</div></div>
        <div class="reel-window"><div class="reel" id="reel-2">🍒</div></div>
        <div class="reel-window"><div class="reel" id="reel-3">🍒</div></div>
      </div>
      <div id="slot-msg" style="text-align:center; height:30px; font-weight:bold; margin-top:10px;"></div>
      <button class="glass-btn" style="margin-top:20px; width:100%" onclick="spinSlots()" data-key="spin_btn">КРУТИТЬ</button>
    </div>

    <div id="rand-screen" class="screen">
      <button class="back-btn" onclick="goBack()" data-key="back">Назад</button>
      <div class="input-group">
        <label data-key="rand_limit_label">Max:</label>
        <input type="number" id="rand-max" class="glass-input" value="100">
        <div id="rand-display" class="big-number">0</div>
        <button class="glass-btn" onclick="generateRandom()" data-key="generate">СТАРТ</button>
      </div>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
